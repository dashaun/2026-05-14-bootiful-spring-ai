---
applications:
  - name: scheduler
    path: target/scheduler-0.0.1-SNAPSHOT.jar
    memory: 1G
    disk_quota: 1G
    instances: 1
    health-check-type: port
    timeout: 180
    buildpacks:
      - java_buildpack_offline
    env:
      JBP_CONFIG_OPEN_JDK_JRE: '{ jre: { version: 25.+ } }'
      SPRING_SECURITY_OAUTH2_RESOURCESERVER_JWT_ISSUER_URI: https://auth.apps.tas-ndc.kuhn-labs.com
