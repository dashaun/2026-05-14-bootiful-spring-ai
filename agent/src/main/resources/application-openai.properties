# Default profile (used when nothing is set, e.g. on Cloud Foundry).
# Uses Spring AI OpenAI for chat + embeddings. On CF, java-cfenv-boot maps the bound
# `ai-models` service credentials into spring.ai.openai.* properties automatically.

# Locally, set OPENAI_API_KEY (and optionally OPENAI_BASE_URL) in the environment.
spring.ai.openai.api-key=${OPENAI_API_KEY:}

spring.ai.openai.chat.options.model=gpt-4o-mini
spring.ai.openai.embedding.options.model=text-embedding-3-small

# text-embedding-3-small produces 1536-dim vectors.
spring.ai.vectorstore.pgvector.dimensions=1536

# Keep only the OpenAI model autoconfigs active in this profile.
spring.autoconfigure.exclude=\
  org.springframework.ai.model.ollama.autoconfigure.OllamaApiAutoConfiguration,\
  org.springframework.ai.model.ollama.autoconfigure.OllamaChatAutoConfiguration,\
  org.springframework.ai.model.ollama.autoconfigure.OllamaEmbeddingAutoConfiguration
