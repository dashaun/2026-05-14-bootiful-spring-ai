# Run with `--spring.profiles.active=flyway` (or SPRING_PROFILES_ACTIVE=flyway) to populate
# the bound postgres database. Designed to be invoked as a one-shot CF task.
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.locations=classpath:db/migration

# One-shot: no web server, exit once the context finishes wiring.
spring.main.web-application-type=none

# Flyway owns the schema in this profile — don't let framework starters race against the migrations.
spring.ai.vectorstore.pgvector.initialize-schema=false
spring.ai.chat.memory.repository.jdbc.initialize-schema=never

# The default OAuth2 client autoconfig eagerly resolves the issuer URI at startup, which
# would fail in a task that has no need for OAuth. Excluding it keeps the migration task lean.
spring.autoconfigure.exclude=\
  org.springframework.boot.security.oauth2.client.autoconfigure.OAuth2ClientAutoConfiguration,\
  org.springframework.boot.security.oauth2.client.autoconfigure.servlet.OAuth2ClientWebSecurityAutoConfiguration,\
  org.springframework.boot.security.oauth2.client.autoconfigure.reactive.ReactiveOAuth2ClientAutoConfiguration,\
  org.springframework.boot.security.oauth2.client.autoconfigure.reactive.ReactiveOAuth2ClientWebSecurityAutoConfiguration,\
  org.springframework.ai.model.ollama.autoconfigure.OllamaApiAutoConfiguration,\
  org.springframework.ai.model.ollama.autoconfigure.OllamaChatAutoConfiguration,\
  org.springframework.ai.model.ollama.autoconfigure.OllamaEmbeddingAutoConfiguration,\
  org.springframework.ai.model.openai.autoconfigure.OpenAiChatAutoConfiguration,\
  org.springframework.ai.model.openai.autoconfigure.OpenAiEmbeddingAutoConfiguration,\
  org.springframework.ai.model.openai.autoconfigure.OpenAiAudioSpeechAutoConfiguration,\
  org.springframework.ai.model.openai.autoconfigure.OpenAiAudioTranscriptionAutoConfiguration,\
  org.springframework.ai.model.openai.autoconfigure.OpenAiImageAutoConfiguration,\
  org.springframework.ai.model.openai.autoconfigure.OpenAiModerationAutoConfiguration,\
  org.springframework.ai.vectorstore.pgvector.autoconfigure.PgVectorStoreAutoConfiguration,\
  org.springframework.ai.model.chat.memory.repository.jdbc.autoconfigure.JdbcChatMemoryRepositoryAutoConfiguration,\
  org.springframework.ai.mcp.client.common.autoconfigure.McpClientAutoConfiguration,\
  org.springframework.ai.mcp.client.common.autoconfigure.McpToolCallbackAutoConfiguration,\
  org.springframework.ai.model.chat.client.autoconfigure.ChatClientAutoConfiguration
